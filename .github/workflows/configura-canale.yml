name: Configura canale

# Da lanciare a mano, una volta: imposta la descrizione del canale e pubblica e fissa
# il messaggio di benvenuto. Con dry_run controlla solo i permessi e mostra i testi.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Controlla i permessi e mostra i testi senza modificare il canale"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  configura:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Descrizione e messaggio di benvenuto
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@ansabasilicata"
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 configura_canale.py
